<title>Field Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1018;
  --raised: #141a24;
  --inset: #0a0d14;
  --border: #1e2a3a;
  --accent-border: #2a3a4e;
  --text: #d4d0c8;
  --muted: #6b7a8d;
  --dim: #4a5568;
  --green: #00d4aa;
  --amber: #e8a838;
  --blue: #4a9eff;
  --red: #e85a5a;
  --violet: #a88bfa;
  --font-data: 'JetBrains Mono', monospace;
  --font-ui: 'Inter', system-ui, sans-serif;
  --row-hover: rgba(74, 158, 255, 0.06);
  --sat-bg: rgba(0, 212, 170, 0.12);
  --high-bg: rgba(232, 168, 56, 0.10);
  --low-bg: transparent;
  --ray0: #4a9eff; --ray1: #00d4aa; --ray2: #e8a838;
  --ray3: #e85a5a; --ray4: #a88bfa; --ray5: #5ad4e8;
  --ray6: #d4aa5a; --ray7: #8bfa8b; --ray8: #fa8bb0;
  --ray9: #b0b0ff; --ray10: #ffb07a; --ray11: #7affda;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1018; --raised: #141a24; --inset: #0a0d14;
    --border: #1e2a3a; --accent-border: #2a3a4e;
    --text: #d4d0c8; --muted: #6b7a8d; --dim: #4a5568;
    --row-hover: rgba(74, 158, 255, 0.06);
    --sat-bg: rgba(0, 212, 170, 0.12);
    --high-bg: rgba(232, 168, 56, 0.10);
  }
}
:root[data-theme="dark"] {
  --bg: #0c1018; --raised: #141a24; --inset: #0a0d14;
  --border: #1e2a3a; --accent-border: #2a3a4e;
  --text: #d4d0c8; --muted: #6b7a8d; --dim: #4a5568;
  --row-hover: rgba(74, 158, 255, 0.06);
  --sat-bg: rgba(0, 212, 170, 0.12);
  --high-bg: rgba(232, 168, 56, 0.10);
}
:root[data-theme="light"] {
  --bg: #f4f2ee; --raised: #ffffff; --inset: #eae7e0;
  --border: #d4d0c8; --accent-border: #c0bab0;
  --text: #2a2520; --muted: #7a7268; --dim: #a09888;
  --green: #00a080; --amber: #b07818; --blue: #2070d0;
  --red: #c03030; --violet: #7050c0;
  --row-hover: rgba(42, 37, 32, 0.04);
  --sat-bg: rgba(0, 160, 128, 0.10);
  --high-bg: rgba(176, 120, 24, 0.08);
  --ray0: #2070d0; --ray1: #00a080; --ray2: #b07818;
  --ray3: #c03030; --ray4: #7050c0; --ray5: #1898b0;
  --ray6: #a08020; --ray7: #308830; --ray8: #c03870;
  --ray9: #5050c0; --ray10: #c07030; --ray11: #20a888;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  margin: 0;
  padding: 12px 16px;
  line-height: 1.4;
}
*, *::before, *::after { box-sizing: border-box; }

/* -- Controls bar -- */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
  padding: 10px 12px;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
}
.ctrl-group { display: flex; flex-direction: column; gap: 3px; }
.ctrl-group label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 500; }
.ctrl-group input[type="text"],
.ctrl-group input[type="number"],
.ctrl-group select {
  background: var(--inset);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 4px;
  outline: none;
}
.ctrl-group input[type="text"]:focus,
.ctrl-group input[type="number"]:focus,
.ctrl-group select:focus { border-color: var(--blue); }
.ctrl-group input[type="text"] { width: 180px; }
.ctrl-group input[type="number"] { width: 64px; }
.ctrl-group select { min-width: 90px; }

/* Ray checkboxes */
.ray-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.ray-cb {
  display: flex; align-items: center; gap: 2px;
  font-size: 11px; font-family: var(--font-data);
  cursor: pointer; padding: 2px 4px; border-radius: 3px;
  user-select: none;
}
.ray-cb:hover { background: var(--row-hover); }
.ray-cb input { margin: 0; accent-color: var(--blue); }

/* -- Stats bar -- */
.stats {
  display: flex;
  gap: 20px;
  padding: 6px 12px;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  font-family: var(--font-data);
  font-size: 12px;
  color: var(--muted);
}
.stats .val { color: var(--text); font-weight: 500; }
.stats .sat { color: var(--green); }

/* -- Table -- */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--raised);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-data);
  font-size: 11.5px;
  white-space: nowrap;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--inset);
  border-bottom: 2px solid var(--accent-border);
  padding: 6px 8px;
  text-align: left;
  font-weight: 500;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: default;
  user-select: none;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--text); }
thead th .arrow { font-size: 9px; margin-left: 3px; opacity: 0.4; }
thead th.sort-asc .arrow,
thead th.sort-desc .arrow { opacity: 1; color: var(--blue); }
tbody td {
  padding: 3px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tbody tr:hover { background: var(--row-hover); }

/* Column widths */
td.c-pos, th.c-pos { width: 40px; text-align: right; }
td.c-dlog, th.c-dlog { width: 40px; text-align: right; }
td.c-ray, th.c-ray { width: 32px; text-align: center; }
td.c-qr, th.c-qr { width: 38px; text-align: center; font-size: 10px; }
td.c-pi, th.c-pi { width: 24px; text-align: center; color: var(--dim); }
td.c-op, th.c-op { width: 52px; }
td.c-amp, th.c-amp { width: 56px; text-align: right; }
td.c-raw, th.c-raw { width: 56px; text-align: right; }
td.c-fold, th.c-fold { width: 40px; text-align: right; }
td.c-flags, th.c-flags { font-size: 10px; color: var(--muted); }
td.c-words, th.c-words { white-space: normal; min-width: 140px; max-width: 260px; font-size: 10.5px; }
td.c-fwords, th.c-fwords { white-space: normal; min-width: 140px; max-width: 260px; font-size: 10.5px; color: var(--muted); }

/* Amplitude coloring */
td.amp-sat { color: var(--green); background: var(--sat-bg); font-weight: 500; }
td.amp-high { color: var(--amber); background: var(--high-bg); }
td.amp-low { color: var(--dim); }

/* QR/QNR */
td.qr-qr { color: var(--green); }
td.qr-qnr { color: var(--amber); }

/* Scrollable table body */
.table-scroll {
  max-height: calc(100vh - 160px);

}

// State
let sortCol = 'pos';
let sortDir = 1; // 1=asc, -1=desc
const rayState = new Array(12).fill(true);

// Build ray checkboxes
const rcEl = document.getElementById('rayChecks');
for (let r = 0; r < 12; r++) {
  const lbl = document.createElement('label');
  lbl.className = 'ray-cb';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true;
  cb.dataset.ray = r;
  cb.addEventListener('change', () => { rayState[r] = cb.checked; render(); });
  const span = document.createElement('span');
  span.textContent = r;
  span.style.color = `var(--ray${r})`;
  lbl.appendChild(cb);
  lbl.appendChild(span);
  rcEl.appendChild(lbl);
}

// Sorting
document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    render();
  });
});

// Filter inputs
const searchEl = document.getElementById('search');
const opEl = document.getElementById('opFilter');
const qrEl = document.getElementById('qrFilter');
const ampMinEl = document.getElementById('ampMin');
const ampMaxEl = document.getElementById('ampMax');
[searchEl, opEl, qrEl, ampMinEl, ampMaxEl].forEach(el => el.addEventListener('input', render));

function getFiltered() {
  const q = searchEl.value.toLowerCase().trim();
  const op = opEl.value;
  const qr = qrEl.value;
  const aMin = parseFloat(ampMinEl.value) || 0;
  const aMax = parseFloat(ampMaxEl.value);
  const aMaxV = isNaN(aMax) ? 1 : aMax;

  return DATA.filter(d => {
    // Ray filter
    if (d.ray !== null && !rayState[d.ray]) return false;
    if (d.ray === null) {
      // pos 0 has no ray - show if any ray is checked
      if (!rayState.some(Boolean)) return false;
    }
    // Opcode
    if (op && d.op !== op) return false;
    // QR/QNR
    if (qr && d.qr !== qr) return false;
    // Amplitude range
    if (d.amp < aMin || d.amp > aMaxV) return false;
    // Text search
    if (q) {
      const hay = `${d.words} ${d.foldWords} ${d.flags} ${d.op} ${d.qr || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function getSorted(arr) {
  return arr.slice().sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va === null) va = -1;
    if (vb === null) vb = -1;
    if (va < vb) return -sortDir;
    if (va > vb) return sortDir;
    return 0;
  });
}

function render() {
  const filtered = getFiltered();
  const sorted = getSorted(filtered);

  // Update sort indicators
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    const arrow = th.querySelector('.arrow');
    if (th.dataset.col === sortCol) {
      th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
      arrow.textContent = sortDir === 1 ? ' ▲' : ' ▼';
    } else {
      arrow.textContent = ' ▲';
    }
  });

  // Stats
  const satCount = filtered.filter(d => d.amp >= 1.0).length;
  const avgAmp = filtered.length ? (filtered.reduce((s, d) => s + d.amp, 0) / filtered.length) : 0;
  document.getElementById('stats').innerHTML =
    `<span>Showing: <span class="val">${filtered.length}</span> / 257</span>` +
    `<span>Avg amp: <span class="val">${avgAmp.toFixed(4)}</span></span>` +
    `<span>Saturated: <span class="val sat">${satCount}</span></span>`;

  // Table body
  const tbody = document.getElementById('tbody');
  const frag = document.createDocumentFragment();
  for (const d of sorted) {
    const tr = document.createElement('tr');

    // Pos
    const tdPos = document.createElement('td');
    tdPos.className = 'c-pos';
    tdPos.textContent = d.pos;
    tr.appendChild(tdPos);

    // Dlog
    const tdDlog = document.createElement('td');
    tdDlog.className = 'c-dlog';
    tdDlog.textContent = d.dlog !== null ? d.dlog : '—';
    tr.appendChild(tdDlog);

    // Ray
    const tdRay = document.createElement('td');
    tdRay.className = 'c-ray';
    if (d.ray !== null) {
      tdRay.textContent = d.ray;
      tdRay.style.color = `var(--ray${d.ray})`;
      tdRay.style.fontWeight = '500';
    } else {
      tdRay.textContent = '—';
      tdRay.style.color = 'var(--dim)';
    }
    tr.appendChild(tdRay);

    // QR
    const tdQr = document.createElement('td');
    tdQr.className = 'c-qr';
    if (d.qr) {
      tdQr.textContent = d.qr;
      tdQr.classList.add(d.qr === 'QR' ? 'qr-qr' : 'qr-qnr');
    } else {
      tdQr.textContent = '—';
      tdQr.style.color = 'var(--dim)';
    }
    tr.appendChild(tdQr);

    // Pi digit
    const tdPi = document.createElement('td');
    tdPi.className = 'c-pi';
    tdPi.textContent = d.pi;
    tr.appendChild(tdPi);

    // Opcode
    const tdOp = document.createElement('td');
    tdOp.className = 'c-op';
    tdOp.textContent = d.op;
    tr.appendChild(tdOp);

    // Amplitude (smoothed)
    const tdAmp = document.createElement('td');
    tdAmp.className = 'c-amp';
    tdAmp.textContent = d.amp.toFixed(4);
    if (d.amp >= 1.0) tdAmp.classList.add('amp-sat');
    else if (d.amp > 0.5) tdAmp.classList.add('amp-high');
    else if (d.amp < 0.2) tdAmp.classList.add('amp-low');
    tr.appendChild(tdAmp);

    // Raw amplitude
    const tdRaw = document.createElement('td');
    tdRaw.className = 'c-raw';
    tdRaw.textContent = d.raw.toFixed(4);
    if (d.raw >= 1.0) tdRaw.classList.add('amp-sat');
    else if (d.raw > 0.5) tdRaw.classList.add('amp-high');
    else if (d.raw < 0.2) tdRaw.classList.add('amp-low');
    tr.appendChild(tdRaw);

    // Fold partner
    const tdFold = document.createElement('td');
    tdFold.className = 'c-fold';
    tdFold.textContent = d.fold;
    tr.appendChild(tdFold);

    // Flags
    const tdFlags = document.createElement('td');
    tdFlags.className = 'c-flags';
    tdFlags.textContent = d.flags;
    tr.appendChild(tdFlags);

    // Words
    const tdWords = document.createElement('td');
    tdWords.className = 'c-words';
    tdWords.textContent = d.words;
    tr.appendChild(tdWords);

    // Fold words
    const tdFWords = document.createElement('td');
    tdFWords.className = 'c-fwords';
    tdFWords.textContent = d.foldWords;
    tr.appendChild(tdFWords);

    frag.appendChild(tr);
  }
  tbody.textContent = '';
  tbody.appendChild(frag);
}

render();
</script>
